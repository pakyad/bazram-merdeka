name: Deploy Bazram Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazram-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name bazram-merdeka --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Bazram custom domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DOMAIN="bazram.iyadiman.me"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/bazram-merdeka/domains"

          STATUS=$(curl -sS -o /tmp/domain.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API}/${DOMAIN}")

          if [ "${STATUS}" = "200" ]; then
            echo "${DOMAIN} is already registered."
          else
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${API}" \
              --data "{\"name\":\"${DOMAIN}\"}"
          fi

      - name: Attach portfolio Worker domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u

          attach_domain() {
            local hostname="$1"
            local service="$2"
            local response

            response=$(curl -sS \
              -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"${service}\",\"zone_name\":\"iyadiman.me\"}")

            echo "${response}"

            if ! echo "${response}" | grep -q '"success":true'; then
              echo "::warning::Could not attach ${hostname} to ${service}. The Cloudflare token may need Workers Routes/Workers Scripts permission."
            else
              echo "Attached ${hostname} to ${service}."
            fi
          }

          attach_domain "alder.iyadiman.me" "alder-roasters"
          attach_domain "princess.iyadiman.me" "princess"
